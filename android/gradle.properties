# Gradle build properties for react-native-abcd-rewardz
#
# GitHub Package Registry credentials for the Loylty Rewardz ABCD SDK.
# Set these here OR export as environment variables GITHUB_USER / GITHUB_TOKEN.
# Never commit real tokens – add this file to .gitignore if you store secrets here.
#
# gpr.user=YOUR_GITHUB_USERNAME
# gpr.key=YOUR_PERSONAL_ACCESS_TOKEN

android.useAndroidX=true
android.enableJetifier=true
